name: Requirement
description: New work the client hasn't approved or received yet (Gen Clover REQ)
title: "[REQ] "
labels: ["type:requirement"]
body:
  - type: markdown
    attributes:
      value: "Work ID = `<project key>-REQ-<this issue number>`. Nothing is built until this is **Approved**."
  - type: textarea
    id: goal
    attributes: { label: Goal, description: What the client wants and why }
    validations: { required: true }
  - type: textarea
    id: criteria
    attributes: { label: Acceptance criteria, description: "Checklist; each becomes a test case", value: "- [ ] " }
    validations: { required: true }
  - type: input
    id: estimate
    attributes: { label: Estimate (hours), placeholder: "e.g. 6 (4–8)" }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority, options: [P1, P2, P3] }
    validations: { required: true }
  - type: textarea
    id: approval
    attributes: { label: Approval, description: "Filled by the PM: approved by, date, how (email/call/signature)" }
